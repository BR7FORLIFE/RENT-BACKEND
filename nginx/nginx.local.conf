events {
    worker_connections 2048;
}

http {
    # =========================================
    # 1. SEGURIDAD GENERAL
    # ==========================================
    server_tokens off;

    # Tamaño máximo de solicitudes.
    client_max_body_size 10m;

    # Timeouts de cliente.
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;

    # ==========================================
    # 2. RATE LIMITING
    # ==========================================

    # Límite general: 10 solicitudes por segundo/IP.
    limit_req_zone $binary_remote_addr
        zone=general_limit:20m
        rate=10r/s;

    # Límite de autenticación.
    limit_req_zone $binary_remote_addr
        zone=auth_limit:10m
        rate=3r/s;

    # Límite de conexiones simultáneas.
    limit_conn_zone $binary_remote_addr
        zone=connection_limit:20m;

    # ==========================================
    # 3. WEBSOCKET
    # ==========================================

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==========================================
    # 4. UPSTREAMS
    # ==========================================

    upstream rent_auth_module {
        server auth:3001;
    }

    upstream rent_financial_module {
        server financial:3002;
    }

    # ==========================================
    # 5. API GATEWAY
    # ==========================================

    server {
	listen 3000 default_server;
        server_name _;

        limit_req_status 429;
        limit_conn_status 429;

        # Límites globales por IP.
        limit_conn connection_limit 30;
        limit_req zone=general_limit burst=20 nodelay;

        # ======================================
        # 5.1 BLOQUEAR ARCHIVOS Y DIRECTORIOS
        # OCULTOS
        # ======================================

        location ~ /\.(?!well-known) {
            access_log off;
            log_not_found off;
            return 404;
        }

        # ======================================
        # 5.2 RUTAS FRECUENTES DE ESCANEO
        # ======================================

        location ~* ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|wordpress|wp-json)(/|$) {
            access_log off;
            return 404;
        }

        location ~* ^/(phpmyadmin|pma|adminer|mysql|myadmin)(/|$) {
            access_log off;
            return 404;
        }

        location ~* ^/(\.git|\.svn|\.hg|\.env|config|backup|backups|dump|database|db)(/|$) {
            access_log off;
            return 404;
        }

        location ~* ^/(cgi-bin|vendor|storage|debug|actuator|server-status|manager|jmx-console)(/|$) {
            access_log off;
            return 404;
        }

        # Archivos sensibles o respaldos.
        location ~* \.(env|ini|log|sql|bak|old|backup|swp|orig|conf|dist)$ {
            access_log off;
            return 404;
        }

        # Archivos PHP y ASP: tu gateway no los necesita.
        location ~* \.(php[0-9]?|phtml|asp|aspx)(/|$) {
            access_log off;
            return 404;
        }

        # ======================================
        # 5.3 AUTH MODULE
        # ======================================

        location /rent-auth/ {

            limit_req zone=general_limit burst=20 nodelay;
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://rent_auth_module;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No confiar en X-Forwarded-For enviado por el cliente.
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ======================================
        # 5.4 FINANCIAL WEBSOCKET
        # ======================================

        location /rent-financial/socket.io/ {

            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://rent_financial_module/socket.io/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ======================================
        # 5.5 FINANCIAL MODULE
        # ======================================

        location /rent-financial/ {

            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://rent_financial_module;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ======================================
        # 5.6 RUTAS NO RECONOCIDAS
        # ======================================

        location / {
            access_log off;
            return 404;
        }
    }
}